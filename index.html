<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleanos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <canvas id="treeCanvas"></canvas>

    <div class="message-box">
      <h2>Para el amor de mi vida: </h2>
      <p>Falta muy poco para tu cumpleaños, y no puedo esperar para celebrar tu cumpleaños y me llena de alegría compartir este momento contigo, de abrazos, besos y sorpresas.</p>
      <p>Gracias por existir y hacerme tan feliz.</p>
      <p class="highlight"> Te amo!</p>
    </div>

    <div class="timer-box">
      <p>Esperando tu cumple en...</p>
      <div id="countdown">0d 00h 00m 00s</div>
      <!-- Sección de Razones por las que te amo -->
<div style="margin-top: 25px; text-align: center;">
        <button id="btnRazon" style="background-color: #e91e63; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: transform 0.2s, background-color 0.2s; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);">
         ✨ Presióname para ver una razón ✨
         </button>
        <p id="textoRazon" style="margin-top: 15px; color: #c2185b; font-weight: 500; font-style: italic; min-height: 40px; padding: 0 10px;"></p>
</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
