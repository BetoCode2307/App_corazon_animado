<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleanos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <canvas id="treeCanvas"></canvas>

    <div class="message-box">
      <h2>Para el amor de mi vida: </h2>
      <p>Falta muy poco para tu cumpleaños, y no puedo esperar para celebrar tu cumpleaños y me llena de alegría compartir este momento contigo, de abrazos, besos y sorpresas.</p>
      <p>Gracias por existir y hacerme tan feliz.</p>
      <p class="highlight"> Te amo!</p>
    </div>

    <div class="timer-box">
      <p>Esperando tu cumple en...</p>
      <div id="countdown">0d 00h 00m 00s</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
